<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Campus Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left sidebar + scrolling main column; dark maroon glass surfaces, isometric slab cards */
:root{
  --ink:#12050a; --maroon:#2b0a14; --crimson:#c8102e; --red:#ff4057; --white:#ffffff;
  --text:#ffffff; --mute:#e9c9cf; --faint:#b98c95; --line:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12);
  --ok:#47e0a0; --warn:#ffc15a;
  --display:'Unbounded','Trebuchet MS',sans-serif; --body:'Manrope','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 600px at 85% -10%,rgba(200,16,46,.55),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(255,64,87,.28),transparent 60%),
  linear-gradient(160deg,#1c0710 0%,#12050a 55%,#240812 100%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.app{display:flex;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:252px;z-index:30;display:flex;flex-direction:column;gap:6px;
  padding:20px 14px;background:linear-gradient(180deg,rgba(60,10,22,.92),rgba(24,6,12,.96));
  border-right:1px solid var(--line);backdrop-filter:blur(14px);transition:transform .3s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font:700 17px var(--display);letter-spacing:.02em}
.brand small{display:block;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.logo{width:42px;height:42px;flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:12px;
  background:none;text-align:left;color:var(--mute);font-weight:600;transition:.2s}
.nav button svg{width:22px;height:22px;flex:none}
.nav button:hover{background:var(--glass);color:var(--white)}
.nav button.on{background:linear-gradient(90deg,var(--crimson),rgba(200,16,46,.25));color:var(--white);border-color:rgba(255,255,255,.2);box-shadow:0 8px 24px rgba(200,16,46,.35)}
.nav .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);padding:1px 8px;border-radius:99px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{margin-left:252px;flex:1;min-width:0;padding-block:20px 60px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:700 clamp(20px,3vw,28px)/1.15 var(--display);margin:0;flex:1;min-width:180px;text-wrap:balance}
.menu{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass)}
.clock{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:var(--glass);border:1px solid var(--line);padding:6px 10px;border-radius:12px}
.clock input{background:transparent;border:0;color:var(--white);font-weight:700;color-scheme:dark}
.scrim{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass2);color:var(--white);font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.btn.red{background:linear-gradient(135deg,var(--red),var(--crimson));border-color:rgba(255,255,255,.3);box-shadow:0 10px 26px rgba(200,16,46,.45)}
.btn.white{background:var(--white);color:#8d0b21;border-color:var(--white)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.big{padding:16px 26px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn svg{width:18px;height:18px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);min-height:260px;display:flex;align-items:flex-end;
  background:linear-gradient(135deg,#7d0a1f,#2b0a14);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .bg svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,5,10,.92) 8%,rgba(160,12,36,.35) 60%,rgba(200,16,46,.15))}
.hero .in{position:relative;z-index:1;padding:26px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.hero h2{font:700 clamp(22px,4vw,36px)/1.1 var(--display);margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--mute);max-width:56ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .photo{position:absolute;right:14px;top:14px;z-index:2}
/* grids + iso cards */
.grid{display:grid;gap:18px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:26px 0 22px;perspective:1100px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.iso{position:relative;border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--line);transform-style:preserve-3d;transition:transform .35s,box-shadow .35s;
  box-shadow:8px 10px 0 -3px rgba(200,16,46,.4),0 24px 44px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.22)}
.stats .iso{transform:rotateX(6deg) rotateY(-9deg)}
.stats .iso:hover{transform:rotateX(0) rotateY(0) translateY(-6px);box-shadow:10px 14px 0 -3px rgba(255,64,87,.5),0 32px 56px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.stat{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer;text-align:left;width:100%;border-width:1px}
.stat .n{font:700 40px/1 var(--display)}
.stat .l{color:var(--mute);font-size:13px;margin-top:8px}
.panel{border-radius:18px;padding:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);min-width:0}
.panel h3{font:700 15px var(--display);margin:0 0 14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
/* chips, list items, badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--glass2);border:1px solid var(--line);white-space:nowrap}
.chip.urgent{background:var(--red);border-color:#fff;color:#fff}
.chip.high{background:rgba(255,193,90,.2);color:var(--warn);border-color:rgba(255,193,90,.5)}
.chip.done{background:rgba(71,224,160,.18);color:var(--ok);border-color:rgba(71,224,160,.5)}
.chip.exp{background:rgba(255,255,255,.06);color:var(--faint)}
.chip.soon{background:var(--white);color:#8d0b21;border-color:#fff}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s;min-width:0}
.item:hover{background:rgba(255,255,255,.1);transform:translateX(3px)}
.item.urgent{border-color:rgba(255,64,87,.7);box-shadow:inset 4px 0 0 var(--red)}
.item.is-done .ttl{text-decoration:line-through;opacity:.6}
.datebox{flex:none;width:54px;text-align:center;border-radius:12px;padding:6px 0;background:linear-gradient(160deg,var(--red),var(--crimson));box-shadow:4px 5px 0 rgba(0,0,0,.35)}
.datebox b{display:block;font:700 20px/1 var(--display)}
.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.datebox.none{background:var(--glass2)}
.item .body{flex:1;min-width:0}
.ttl{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;color:var(--mute);font-size:13px}
.desc{color:var(--mute);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--glass);transition:.2s}
.ib:hover{background:var(--glass2);transform:translateY(-2px)}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--white);color:#c8102e}
.ib.del:hover{background:var(--red)}
.empty{text-align:center;padding:34px 16px;color:var(--mute);border:1px dashed var(--line);border-radius:16px}
.empty svg{width:64px;height:64px;margin-bottom:8px}
/* forms */
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:5px;font-weight:700}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--white);color-scheme:dark}
textarea{min-height:200px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
select option{background:#2b0a14}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.form .full{grid-column:1/-1}
.err{color:#ffd0d6;background:rgba(255,64,87,.25);border:1px solid var(--red);padding:8px 12px;border-radius:10px;font-size:13px}
.note{font-size:13px;color:var(--mute)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mode button{border:0;background:transparent;padding:8px 14px;font-weight:700;color:var(--mute)}
.mode button.on{background:var(--white);color:#8d0b21}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:180px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:13px;color:var(--mute)}
.chips button.on{background:var(--red);color:#fff;border-color:#fff}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 0}
.cal .day{min-height:74px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cal .day:hover{background:var(--glass2)}
.cal .day.blank{visibility:hidden}
.cal .day.today{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.cal .day.sel{background:rgba(255,64,87,.3)}
.cal .day .d{font-weight:700;font-size:13px}
.cal .ev{font-size:11px;line-height:1.2;padding:2px 5px;border-radius:6px;background:var(--crimson);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.urgent{background:#fff;color:#8d0b21;font-weight:700}
.cal .ev.dl{background:rgba(255,193,90,.25);color:var(--warn)}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calhead h3{margin:0;flex:1;min-width:140px}
/* summary */
.summary{white-space:normal;font-size:15px;line-height:1.7}
.summary h4{font:700 14px var(--display);margin:18px 0 6px;color:var(--red)}
.summary ul{margin:0;padding-left:20px}
.summary li{margin:3px 0}
.lbl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--white);color:#8d0b21}
.lbl.demo{background:var(--warn)}
.cursor{display:inline-block;width:8px;height:16px;background:var(--red);animation:blink 1s steps(2) infinite;vertical-align:-3px}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,2,5,.75);backdrop-filter:blur(6px);animation:fade .2s}
.modal .box{width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px;background:linear-gradient(160deg,#3a0c19,#1a0610);border:1px solid rgba(255,255,255,.25);animation:pop .3s}
.modal h3{font:700 18px var(--display);margin:0 0 14px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:80;background:var(--white);color:#8d0b21;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.5);animation:pop .3s}
.sec{animation:rise .5s both}
.pop{animation:pop .35s}
/* statistic card icon tiles */
.tile{--g1:#c4b5fd;--g2:#8b5cf6;--g3:#6d28d9;--glow:139,92,246;position:relative;flex:none;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--g1) 0%,var(--g2) 52%,var(--g3) 100%);border:1px solid rgba(255,255,255,.4);
  box-shadow:0 14px 30px rgba(var(--glow),.5),0 4px 10px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.18);
  animation:tfloat 3.6s ease-in-out infinite;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;isolation:isolate}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.08) 42%,transparent 60%)}
.tile::after{content:"";position:absolute;inset:-10px;border-radius:30px;z-index:-2;background:rgba(var(--glow),.35);filter:blur(16px);opacity:.75;transition:opacity .35s}
.tile .gl{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .35s}
.tile .spk{position:absolute;top:7px;right:7px;width:15px;height:15px;color:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.9));animation:twinkle 2.4s ease-in-out infinite}
.tile.purple{--g1:#d8ccff;--g2:#9a6bff;--g3:#6a2bd8;--glow:154,107,255}
.tile.cyan{--g1:#b6f4ff;--g2:#2cc9ee;--g3:#0a84d6;--glow:44,201,238}
.tile.coral{--g1:#ffc2cf;--g2:#ff6b83;--g3:#e0244b;--glow:255,107,131}
.tile.amber{--g1:#ffe9a3;--g2:#ffb62e;--g3:#e07a05;--glow:255,182,46}
.stats .iso:nth-child(2) .tile{animation-delay:-.9s}.stats .iso:nth-child(3) .tile{animation-delay:-1.8s}.stats .iso:nth-child(4) .tile{animation-delay:-2.7s}
.stat:hover .tile{transform:translateY(-4px) scale(1.09) rotate(-4deg);box-shadow:0 20px 38px rgba(var(--glow),.65),0 6px 12px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.75),inset 0 -8px 14px rgba(0,0,0,.18)}
.stat:hover .tile::after{opacity:1}
.stat:hover .tile .gl{transform:scale(1.08)}
@keyframes tfloat{50%{translate:0 -6px}}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
/* animated icons */
.fl{animation:float 3.2s ease-in-out infinite}
.ring{transform-origin:50% 10%;animation:ring 2.6s ease-in-out infinite}
.beat{transform-origin:center;transform-box:fill-box;animation:beat 1.8s ease-in-out infinite}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 9s linear infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-5deg)}}
@keyframes beat{50%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* responsive */
@media (max-width:900px){
  .side{transform:translateX(-100%);width:min(280px,86vw)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6)}
  .main{margin-left:0}
  .menu{display:grid;place-items:center}
  .stats .iso{transform:none}
}
@media (max-width:560px){
  .cal{gap:3px}
  .cal .day{min-height:56px;padding:4px}
  .cal .ev{font-size:0;height:6px;padding:0;border-radius:3px}
  .hero .in{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <svg class="logo" viewBox="0 0 42 42" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4057"/><stop offset="1" stop-color="#9b0a22"/></linearGradient></defs><rect width="42" height="42" rx="12" fill="url(#lg)"/><path d="M6 23h8l4-9 6 17 4-8h8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Campus Pulse</b><small>MIT Moradabad</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="scrim" id="scrim" data-a="menu"></div>
  <main class="main">
    <div class="top">
      <button class="menu" id="menu" data-a="menu" aria-label="Open menu"></button>
      <h1 id="ptitle">Campus Pulse</h1>
      <label class="clock" for="today" style="margin:0;text-transform:none;letter-spacing:0">Demo date <input type="date" id="today"></label>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay"></div>

function vRem(){ const rows=[]; S.items.forEach(it=>{ const k=it.category==='Assignments'?'Assignment due':it.category==='Exams'?'Exam':it.category==='Holidays'?'Holiday':'Event';
    if(pd(it.date))rows.push({it,date:it.date,kind:k}); if(pd(it.regDeadline)&&it.regDeadline!==it.date)rows.push({it,date:it.regDeadline,kind:'Registration closes'}); else if(pd(it.regDeadline))rows[rows.length-1].kind+=' + registration closes'; });
  rows.sort((a,b)=>a.date.localeCompare(b.date)); const G=[['Overdue or expired',r=>!r.it.completed&&diff(r.date)<0],['Within 3 days',r=>!r.it.completed&&diff(r.date)>=0&&diff(r.date)<=3],['This week',r=>!r.it.completed&&diff(r.date)>3&&diff(r.date)<=7],['Later',r=>!r.it.completed&&diff(r.date)>7],['Completed',r=>r.it.completed]];
  const out=G.map(([t,fn])=>{ const a=rows.filter(fn); if(!a.length)return ''; return `<div class="panel" style="margin-bottom:16px"><h3>${t} <span class="chip ${t==='Within 3 days'?'soon':''}">${a.length}</span></h3><div class="stack">${a.map(r=>`<div class="item ${r.it.priority==='Urgent'&&!r.it.completed?'urgent':''}">${dbox(r.date)}<div class="body"><div class="ttl">${esc(r.it.title)}</div><div class="meta"><span class="chip">${esc(r.kind)}</span><span>${esc(fmtD(r.date,true))}</span><span>${rel(diff(r.date))}</span></div>
    <div class="acts"><button class="btn sm" data-a="done" data-id="${r.it.id}">${ic('check')} ${r.it.completed?'Reopen':'Mark done'}</button></div></div></div>`).join('')}</div></div>`; }).join('');
  return `<section class="sec">${out||emptyBox('No reminders','Announcements with dates and deadlines show up here.')}</section>`; }
const md=t=>{ let h='',inl=false; String(t).split('\n').forEach(l=>{ l=esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); if(/^#{1,4}\s/.test(l)){ if(inl){h+='</ul>';inl=false;} h+='<h4>'+l.replace(/^#{1,4}\s/,'')+'</h4>'; } else if(/^\s*[-*]\s+/.test(l)){ if(!inl){h+='<ul>';inl=true;} h+='<li>'+l.replace(/^\s*[-*]\s+/,'')+'</li>'; } else if(l.trim()){ if(inl){h+='</ul>';inl=false;} h+='<p style="margin:6px 0">'+l+'</p>'; } }); return h+(inl?'</ul>':''); };
function vSum(){ const s=S.sum; return `<section class="panel sec"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px">${weekBtn('red')}<button class="btn" data-a="mode2">${AI&&S.mode==='ai'?'Using Claude AI':'Using demo summary'}</button></div>
   <p class="note" style="margin:0 0 14px">Built from your ${S.items.length} saved announcements. Today in the app is ${esc(fmtD(S.today,true))}.</p>
   <div id="sumhead">${s.mode?`<span class="lbl ${s.mode==='Claude AI'?'':'demo'}">${s.mode==='Claude AI'?'Written by Claude AI':'Demo summary from your saved data'}</span>`:''}</div>
   <div class="summary" id="sumbox" aria-live="polite">${s.text?md(s.text):'<div class="empty">'+ic('brain','fl')+'<div>Press the button to get your summary.</div></div>'}</div>${s.err?`<div class="err" style="margin-top:12px">${esc(s.err)}</div>`:''}</section>`; }
const VIEWS={dashboard:vDash,smart:vSmart,announcements:vAnn,events:vEvents,calendar:vCal,reminders:vRem,summary:vSum};
function nav(){ const s=stats(); $('#nav').innerHTML=PAGES.map(([id,l,i,a])=>`<button data-a="go" data-p="${id}" class="${S.page===id?'on':''}" ${S.page===id?'aria-current="page"':''}>${ic(i,a)}<span>${l}</span>${id==='announcements'?`<span class="cnt">${s.total}</span>`:id==='reminders'&&s.deadlines?`<span class="cnt">${s.deadlines}</span>`:''}</button>`).join('');
  $('#foot').innerHTML=`<span class="chip" style="align-self:flex-start">${AI?'Claude AI ready':'Demo mode (no AI here)'}</span><button class="btn sm" data-a="data">${ic('down')} Export / Import</button><div class="note" style="padding:0 4px">${S.saved?'Saved in this browser':'Storage unavailable: use Export'}</div>`; }
function render(){ nav(); $('#ptitle').textContent=TITLES[S.page]; $('#menu').innerHTML=ic('menu'); const t=$('#today'); if(t&&t.value!==S.today)t.value=S.today; $('#view').innerHTML=VIEWS[S.page](); }
/* ===== Actions ===== */
let toastT; function toast(m){ const b=$('#toastbox'); b.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>b.innerHTML='',2600); }
function modal(h){ $('#overlay').innerHTML=`<div class="modal" data-a="mclose"><div class="box" role="dialog" aria-modal="true">${h}</div></div>`; }
function closeModal(){ $('#overlay').innerHTML=''; }
function go(p,f){ S.page=p; if(f==='urgent'){S.status='urgent';S.filter='All';S.q='';} else if(p==='announcements'&&f===undefined&&!S.keep){} S.confirmDel=null; $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); render(); window.scrollTo(0,0); }
function editModal(id){ const it=id?S.items.find(i=>i.id===id):{title:'',date:'',time:'',venue:'',category:'General',description:'',regDeadline:'',priority:NS,completed:false,fav:false};
  if(!it)return; S.editId=id||null; modal(`<h3>${id?'Edit announcement':'Add announcement'}</h3>${formHTML(it,'m_')}<div class="toolbar" style="margin:16px 0 0"><button class="btn red" data-a="msave">Save</button><button class="btn" data-a="mclose2">Cancel</button></div>`); }
function dataModal(){ const j=JSON.stringify(S.items,null,2);
  modal(`<h3>Export, import and reset</h3><div class="stack"><div><label>Export</label><div class="toolbar"><button class="btn red" data-a="export">${ic('down')} Download JSON</button><button class="btn" data-a="copyjson">Copy JSON</button></div><textarea id="jsonout" readonly style="min-height:90px">${esc(j)}</textarea></div>
  <div><label for="jsonin">Import (replaces current data)</label><input type="file" id="jsonfile" accept=".json,application/json" style="margin-bottom:8px"><textarea id="jsonin" style="min-height:90px" placeholder="Paste exported JSON here"></textarea><div class="err" id="jerr" hidden style="margin:8px 0"></div><button class="btn" data-a="import" style="margin-top:8px">${ic('plus')} Import JSON</button></div>
  <div><label>Sample data</label><button class="btn" data-a="reset" id="resetbtn">${ic('reset')} Reset to the 5 sample announcements</button></div><button class="btn" data-a="mclose2" style="align-self:flex-start">Close</button></div>`); }
function localSummary(){ const W=S.win, t=S.today; const within=(d,a,b)=>{const n=diff(d);return n!==null&&n>=a&&n<=b;}; const act=S.items.filter(i=>!i.completed);
  const line=(i,d)=>`- **${i.title}** on ${fmtD(d||i.date,true)} (${rel(diff(d||i.date)).toLowerCase()})${i.time?', '+i.time:''}${i.venue?', '+i.venue:''}`;
  const sec=(h,arr,empty)=>`## ${h}\n`+(arr.length?arr.join('\n'):`- ${empty}`)+'\n';
  const ev=act.filter(i=>['Events','Workshops'].includes(i.category)&&within(i.date,0,W)).map(i=>line(i));
  const asg=act.filter(i=>i.category==='Assignments'&&within(i.date,0,W)).map(i=>line(i));
  const reg=act.filter(i=>pd(i.regDeadline)&&within(i.regDeadline,0,W)).map(i=>`- Register for **${i.title}** by ${fmtD(i.regDeadline,true)} (${rel(diff(i.regDeadline)).toLowerCase()})`);
  const urg=act.filter(i=>i.priority==='Urgent'&&!(diff(i.date)!==null&&diff(i.date)<0)).map(i=>`- **${i.title}** ${pd(i.date)?'on '+fmtD(i.date,true):'(no date given)'}`);
  const tasks=[...act.filter(i=>i.category==='Assignments'&&within(i.date,0,3)).map(i=>`- Finish **${i.title}** now, it is due ${rel(diff(i.date)).toLowerCase()}`),...act.filter(i=>pd(i.regDeadline)&&within(i.regDeadline,0,3)).map(i=>`- Register for **${i.title}** before ${fmtD(i.regDeadline)}`),...act.filter(i=>i.category==='Exams'&&within(i.date,0,30)).map(i=>`- Prepare for **${i.title}** (${fmtD(i.date,true)})`)];
  const later=sorted(act.filter(i=>within(i.date,W+1,30)),'asc').map(i=>line(i)); const over=act.filter(i=>diff(i.date)!==null&&diff(i.date)<0).map(i=>`- **${i.title}** was on ${fmtD(i.date)}`);
  return `## Your week at a glance (${fmtD(t)} to ${fmtD(ymd(new Date(pd(t).getTime()+W*86400000)))})\n`+sec('Upcoming events',ev,'No events or workshops this week.')+sec('Assignment deadlines',asg,'No assignment deadlines this week.')+sec('Registration deadlines',reg,'No registration deadlines this week.')+sec('Urgent notices',urg,'No urgent notices.')+sec('Important tasks',tasks,'Nothing pressing right now.')+(later.length?'## Coming up later this month\n'+later.join('\n')+'\n':'')+(over.length?'## Already passed (pending)\n'+over.join('\n'):''); }
async function weekSummary(){ S.page='summary'; render(); const box=()=>$('#sumbox'); const S2=S.sum; S2.err=''; S2.loading=true;
  const data=S.items.map(i=>({title:i.title,date:i.date||NS,time:i.time||NS,venue:i.venue||NS,category:i.category,priority:i.priority,registrationDeadline:i.regDeadline||NS,completed:i.completed}));
  if(AI&&S.mode==='ai'){ $('#sumbox').innerHTML='<span class="note">Thinking...</span> <span class="cursor"></span>';
    const prompt='You are Campus Pulse, a campus assistant for a college student. Today is '+S.today+'. Using ONLY the saved announcements below, write a short weekly briefing (max 220 words).\nUse these markdown headings in this order: ## Upcoming events, ## Assignment deadlines, ## Registration deadlines, ## Urgent notices, ## Important tasks. Cover the next 7 days first, then add one short line for anything important in the following 3 weeks. Skip completed items. If a heading has nothing, write "- Nothing this week." Use "-" bullets and **bold** titles. Do not invent any detail, and say "not specified" when a time or venue is missing.\n\nANNOUNCEMENTS (JSON):\n'+JSON.stringify(data);
    try{ const r=await AI(prompt,{onText:({text})=>{S2.text=text;S2.mode='Claude AI';if(box()){box().innerHTML=md(text)+'<span class="cursor"></span>';$('#sumhead').innerHTML='<span class="lbl">Written by Claude AI</span>';}},cache:{gcTime:60000}});
      S2.text=r.text; S2.mode='Claude AI'; S2.loading=false; render(); return; }
    catch(e){ if(e&&e.code==='cancelled'){S2.loading=false;render();return;} S2.err='Claude AI could not answer ('+(e&&e.code||'error')+'). Showing a demo summary built from your saved data instead.'; } }
  S2.text=localSummary(); S2.mode='Demo'; S2.loading=false; render(); }
async function extract(){ const t=($('#paste')||{}).value||''; S.inputText=t; S.inputErr=''; S.draft=null;
  if(t.trim().length<8){ S.inputErr='Paste a message or notice first (at least a few words).'; render(); return; }
  S.busy=true; render(); let res=null,mode='';
  if(AI&&S.mode==='ai'){ try{ const o=await aiExtract(t); res=cleanItem(o); mode='Claude AI'; }catch(e){ S.inputErr='Claude AI could not read this ('+(e&&e.code||'error')+'), so demo extraction was used instead.'; } }
  if(!res){ res=cleanItem(demoExtract(t)); mode='Demo'; }
  S.busy=false; S.draft=res; S.draftMode=mode; render(); const c=$('#d_form'); if(c)c.scrollIntoView({behavior:'smooth',block:'center'}); }
function validImport(a){ return Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&typeof x.title==='string'); }
function resizePhoto(file){ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const sc=Math.min(1,1400/im.width); const c=document.createElement('canvas'); c.width=im.width*sc; c.height=im.height*sc; c.getContext('2d').drawImage(im,0,0,c.width,c.height); S.photo=c.toDataURL('image/jpeg',.82); try{localStorage.setItem(PKEY,S.photo);}catch(e){} render(); toast('Campus photo updated'); }; im.onerror=()=>toast('That file is not a usable image'); im.src=fr.result; }; fr.readAsDataURL(file); }
document.addEventListener('click',async e=>{ const el=e.target.closest('[data-a]'); if(!el)return; const a=el.dataset.a, id=el.dataset.id;
  if(a==='mclose'&&e.target!==el)return;
  switch(a){
   case 'menu': $('#side').classList.toggle('open'); $('#scrim').classList.toggle('open'); break;
   case 'go': go(el.dataset.p,el.dataset.f); break;
   case 'week': await weekSummary(); break;
   case 'mode': S.mode=el.dataset.m; render(); break;
   case 'mode2': S.mode=(S.mode==='ai'?'demo':'ai'); if(S.mode==='ai'&&!AI)S.mode='demo'; toast(S.mode==='ai'?'Claude AI summary on':'Demo summary on'); render(); break;
   case 'ex': S.inputText=SAMPLE_MSGS[+el.dataset.i]; S.draft=null; render(); break;
   case 'extract': await extract(); break;
   case 'dsave': { const {v,errs}=readForm('d_',S.draft); showErr('d_',errs); if(errs.length)break; S.items.push({...v,id:uid()}); save(); S.draft=null; S.inputText=''; toast('Announcement saved'); go('announcements'); break; }
   case 'dcancel': S.draft=null; render(); break;
   case 'new': editModal(null); break;
   case 'edit': editModal(id); break;
   case 'msave': { const base=S.editId?S.items.find(i=>i.id===S.editId):{id:uid(),completed:false,fav:false}; const {v,errs}=readForm('m_',base); showErr('m_',errs); if(errs.length)break; if(S.editId)Object.assign(base,v,{sample:base.sample}); else S.items.push(v); save(); closeModal(); toast(S.editId?'Changes saved':'Announcement added'); render(); break; }
   case 'mclose': case 'mclose2': closeModal(); break;
   case 'del': S.confirmDel=id; render(); break;
   case 'delno': S.confirmDel=null; render(); break;
   case 'delok': S.items=S.items.filter(i=>i.id!==id); S.confirmDel=null; save(); toast('Announcement deleted'); render(); break;
   case 'fav': { const it=S.items.find(i=>i.id===id); it.fav=!it.fav; save(); render(); break; }
   case 'done': { const it=S.items.find(i=>i.id===id); it.completed=!it.completed; save(); toast(it.completed?'Marked as completed':'Marked as pending'); render(); break; }
   case 'filter': S.filter=el.dataset.c; render(); break;
   case 'sort': S.sort=S.sort==='asc'?'desc':'asc'; render(); break;
   case 'cal': { const [y,m]=S.calMonth.split('-').map(Number); const n=+el.dataset.n; const d=n===0?new Date(pd(S.today)):new Date(y,m-1+n,1); S.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
   case 'calview': S.calView=el.dataset.v; render(); break;
   case 'selday': S.selDay=el.dataset.d; render(); break;
   case 'data': dataModal(); break;
   case 'export': { const j=JSON.stringify(S.items,null,2); if(DL){ try{ await DL.save({filename:'campus-pulse-data.json',data:j}); toast('Export ready'); }catch(er){ if(er&&er.code!=='declined')toast('Download unavailable: copy the JSON instead'); } } else toast('Download unavailable: copy the JSON instead'); break; }
   case 'copyjson': { const ta=$('#jsonout'); try{ await navigator.clipboard.writeText(ta.value); toast('JSON copied'); }catch(er){ ta.select(); toast('Press Ctrl+C to copy'); } break; }
   case 'import': { const raw=($('#jsonin').value||'').trim(); const er=$('#jerr'); let a; try{ a=JSON.parse(raw); }catch(x){ er.hidden=false; er.textContent='That is not valid JSON.'; break; }
     if(!validImport(a)){ er.hidden=false; er.textContent='JSON must be a list of announcements, each with a title.'; break; }
     S.items=a.map(x=>({...cleanItem(x),id:x.id||uid(),completed:!!x.completed,fav:!!x.fav,sample:!!x.sample})); save(); closeModal(); toast('Imported '+S.items.length+' announcements'); render(); break; }
   case 'reset': { const b=$('#resetbtn'); if(b.dataset.sure){ S.items=SAMPLES(); S.filter='All';S.q='';S.status='all'; save(); closeModal(); toast('Sample data restored'); render(); } else { b.dataset.sure='1'; b.textContent='Click again to confirm reset'; } break; }
  } });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='q'){ S.q=t.value; $('#list').innerHTML=listHTML(); }
  else if(t.id==='paste')S.inputText=t.value;
  else if(t.dataset&&t.dataset.hint){ const h=$('#'+t.dataset.hint); if(h)h.hidden=!!t.value; } });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='status'){ S.status=t.value; render(); }
  else if(t.id==='today'){ if(pd(t.value)){S.today=t.value;S.calMonth=null;render();} else {t.value=S.today;} }
  else if(t.id==='photo'&&t.files[0])resizePhoto(t.files[0]);
  else if(t.id==='jsonfile'&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{$('#jsonin').value=fr.result;}; fr.readAsText(t.files[0]); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
/* ===== Boot ===== */
load(); loadPhoto(); $('#today').value=S.today; render();
if(window.claude&&claude.use){
  claude.use('sample').then(f=>{ if(f){AI=f; S.mode='ai'; } else S.mode='demo'; render(); }).catch(()=>{S.mode='demo';});
  claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});
} else S.mode='demo';
</script>

</body></html>
